<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de temperatura</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <div class="card">
        <h2>Conversor de temperatura</h2>
        
        <div class="input-group">
            <label>Celsius:</label>
            <input type="number" id="celsius" placeholder="Temperatura en Celcius:">
        </div>

        <div class="input-group">
            <label>Fahrenheit:</label>
            <input type="number" id="fahrenheit" placeholder="Temperatura en Fahrenheit:">
        </div>

        <button id="btnConvertir">Convertir</button>
        
        <p id="resultado"></p>
    </div>
    
    <script src="temperaturas.js"></script>
</body>
</html>
